<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Trek Art Picker</title>
<style>
  :root {
    --bg: #0d0818; --panel: #1a1030; --panel2: #231640; --line: #3a2a5c;
    --fg: #ece6f7; --dim: #a79cc0; --gold: #f3d27a; --ok: #5fd38a; --re: #ff9b54;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(13, 8, 24, .95); border-bottom: 1px solid var(--line);
           padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  h1 { font-size: 17px; margin: 0; color: var(--gold); letter-spacing: .02em; }
  .stat b { color: var(--fg); } .stat { color: var(--dim); }
  .filters button { background: var(--panel); color: var(--dim); border: 1px solid var(--line); border-radius: 6px;
                    padding: 4px 10px; cursor: pointer; font: inherit; }
  .filters button.on { color: var(--fg); border-color: var(--gold); }
  #saved { margin-left: auto; color: var(--dim); font-size: 13px; }
  main { padding: 8px 16px 60px; max-width: 1280px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); margin: 22px 0 8px; }
  table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
  th { text-align: left; font-weight: 500; color: var(--dim); font-size: 12px; padding: 0 10px; }
  td { background: var(--panel); padding: 10px; vertical-align: middle; }
  td:first-child { border-radius: 10px 0 0 10px; } td:last-child { border-radius: 0 10px 10px 0; }
  tr.keep td { background: #172a24; }
  .name { font-weight: 600; font-size: 15px; }
  .count { color: var(--dim); font-size: 12px; }
  .ref { width: 84px; height: 84px; border-radius: 8px; display: block; opacity: .85; }
  .reflabel { color: var(--dim); font-size: 11px; text-align: center; }
  .viewer { display: flex; align-items: center; gap: 6px; }
  .big { width: 176px; height: 176px; position: relative; border-radius: 10px; background: var(--panel2); flex: none; }
  .big img { width: 100%; height: 100%; display: block; }
  .big .tag { position: absolute; left: 6px; top: 6px; font-size: 11px; background: rgba(0,0,0,.6); padding: 1px 6px; border-radius: 4px; }
  .big .tag.fav { color: var(--gold); }
  .arrow { width: 30px; height: 60px; border: 1px solid var(--line); background: var(--panel2); color: var(--fg);
           border-radius: 6px; font-size: 18px; cursor: pointer; }
  .arrow:disabled { opacity: .3; cursor: default; }
  .strip { display: flex; flex-wrap: wrap; gap: 5px; max-width: 330px; }
  .strip img { width: 52px; height: 52px; border-radius: 6px; background: var(--panel2); cursor: pointer; border: 2px solid transparent; }
  .strip img.sel { border-color: var(--gold); }
  .strip .empty { color: var(--dim); font-size: 12px; }
  .hues { display: flex; gap: 6px; margin-top: 8px; }
  .hues button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .hues button.sel { border-color: #fff; }
  .hues .lbl { color: var(--dim); font-size: 12px; align-self: center; }
  label.tog { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; white-space: nowrap; }
  label.tog input { width: 18px; height: 18px; accent-color: var(--ok); }
  label.re input { accent-color: var(--re); }
  textarea { width: 100%; min-width: 180px; background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
             border-radius: 6px; padding: 6px; font: 13px system-ui, sans-serif; resize: vertical; margin-top: 6px; }
  textarea:disabled { opacity: .4; }
  .hidden { display: none; }
  @media (max-width: 820px) {
    table, tbody, tr, td { display: block; } thead { display: none; }
    td { border-radius: 0 !important; } tr td:first-child { border-radius: 10px 10px 0 0 !important; }
    tr td:last-child { border-radius: 0 0 10px 10px !important; }
  }
</style>
</head>
<body>
<header>
  <h1>Star Trek slot · art picker</h1>
  <span class="stat">In final set: <b id="nKeep">0</b> / <b id="nAll">0</b></span>
  <span class="stat">Reiterate: <b id="nRe">0</b></span>
  <span class="filters">
    <button data-f="all" class="on">All</button>
    <button data-f="keep">In set</button>
    <button data-f="open">Not in set</button>
    <button data-f="re">Reiterate</button>
  </span>
  <span id="saved">Loading…</span>
</header>
<main id="main"></main>
<script>
const HUE_SWATCH = { gold: "#d39a26", red: "#d0562e", blue: "#3a7be0", purple: "#9550d8", silver: "#9aa4b2", green: "#3fae4c" };
let M, SEL = {}, filter = "all", saveTimer;

const $ = (t, a = {}, ...kids) => {
  const e = document.createElement(t);
  for (const [k, v] of Object.entries(a)) k.startsWith("on") ? e.addEventListener(k.slice(2), v) : (k in e ? e[k] = v : e.setAttribute(k, v));
  e.append(...kids.filter(k => k != null));
  return e;
};
function state(sym) {
  return SEL[sym.name] ??= { variant: sym.variants[0]?.id ?? null, hue: sym.defaultHue, keep: false, reiterate: false, note: "" };
}
function srcOf(sym, v, st) { return v.hues ? (v.hues[st.hue] ?? Object.values(v.hues)[0]) : v.src; }
function save() {
  document.getElementById("saved").textContent = "Saving…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      // Record the exact file chosen, so the reiterate script needn't know about hues.
      for (const g of M.groups) for (const s of g.symbols) {
        const st = SEL[s.name]; if (!st) continue;
        const v = s.variants.find(v => v.id === st.variant);
        st.file = v ? srcOf(s, v, st) : null;
      }
      const r = await fetch("/api/selections", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(SEL) });
      document.getElementById("saved").textContent = r.ok ? "Saved ✓" : "Save failed";
    } catch { document.getElementById("saved").textContent = "Save failed (is the picker server running?)"; }
  }, 350);
}
function counts() {
  const syms = M.groups.flatMap(g => g.symbols);
  document.getElementById("nAll").textContent = syms.length;
  document.getElementById("nKeep").textContent = syms.filter(s => SEL[s.name]?.keep).length;
  document.getElementById("nRe").textContent = syms.filter(s => SEL[s.name]?.reiterate).length;
}
function applyFilter() {
  for (const tr of document.querySelectorAll("tr[data-sym]")) {
    const st = SEL[tr.dataset.sym] ?? {};
    const show = filter === "all" || (filter === "keep" && st.keep) || (filter === "open" && !st.keep) || (filter === "re" && st.reiterate);
    tr.classList.toggle("hidden", !show);
  }
  for (const sec of document.querySelectorAll("section"))
    sec.classList.toggle("hidden", !sec.querySelector("tr[data-sym]:not(.hidden)"));
}

function row(sym) {
  const st = state(sym);
  const tr = $("tr", { "data-sym": sym.name });
  const bigImg = $("img", { alt: sym.name });
  const tag = $("span", { className: "tag" });
  const prev = $("button", { className: "arrow", textContent: "◀", title: "Previous variant" });
  const next = $("button", { className: "arrow", textContent: "▶", title: "Next variant" });
  const pos = $("div", { className: "count" });
  const strip = $("div", { className: "strip" });
  const hues = $("div", { className: "hues" });
  const keep = $("input", { type: "checkbox", checked: st.keep });
  const re = $("input", { type: "checkbox", checked: st.reiterate });
  const note = $("textarea", { rows: 2, placeholder: "What to change (optional), e.g. 'more gold, less glow'", value: st.note ?? "" });

  function render() {
    const i = Math.max(0, sym.variants.findIndex(v => v.id === st.variant));
    const v = sym.variants[i];
    tr.classList.toggle("keep", st.keep);
    if (!v) { bigImg.removeAttribute("src"); tag.textContent = "nothing yet"; pos.textContent = ""; prev.disabled = next.disabled = true; return; }
    bigImg.src = srcOf(sym, v, st);
    tag.textContent = v.fav ? "★ " + v.label : v.label;
    tag.className = "tag" + (v.fav ? " fav" : "");
    pos.textContent = `${i + 1} / ${sym.variants.length}`;
    prev.disabled = i === 0; next.disabled = i === sym.variants.length - 1;
    strip.querySelectorAll("img").forEach((im, j) => { im.classList.toggle("sel", j === i); im.src = srcOf(sym, sym.variants[j], st); });
    hues.replaceChildren();
    if (v.hues) {
      hues.append($("span", { className: "lbl", textContent: "Frame" }));
      for (const h of Object.keys(v.hues))
        hues.append($("button", { className: h === st.hue ? "sel" : "", title: h, style: `background:${HUE_SWATCH[h]}`,
          onclick: () => { st.hue = h; render(); save(); } }));
    }
    note.disabled = !st.reiterate;
  }
  const go = d => { const i = sym.variants.findIndex(v => v.id === st.variant); const v = sym.variants[i + d]; if (v) { st.variant = v.id; render(); save(); } };
  prev.onclick = () => go(-1); next.onclick = () => go(1);
  sym.variants.forEach(v => strip.append($("img", { title: v.label, loading: "lazy", onclick: () => { st.variant = v.id; render(); save(); } })));
  if (!sym.variants.length) strip.append($("span", { className: "empty", textContent: "No variants yet (still generating?)" }));
  keep.onchange = () => { st.keep = keep.checked; render(); counts(); save(); applyFilter(); };
  re.onchange = () => { st.reiterate = re.checked; render(); counts(); save(); };
  note.oninput = () => { st.note = note.value; save(); };

  tr.append(
    $("td", {}, $("div", { className: "name", textContent: sym.name }), $("div", { className: "count", textContent: `${sym.variants.length} variant${sym.variants.length === 1 ? "" : "s"}` })),
    $("td", {}, $("img", { className: "ref", src: sym.ref, alt: "reference" }), $("div", { className: "reflabel", textContent: "sheet" })),
    $("td", {}, $("div", { className: "viewer" }, prev, $("div", { className: "big" }, bigImg, tag), next), pos),
    $("td", {}, strip, hues),
    $("td", {}, $("label", { className: "tog" }, keep, "In final set")),
    $("td", {}, $("label", { className: "tog re" }, re, "Reiterate"), note),
  );
  render();
  return tr;
}

async function load() {
  [M, SEL] = await Promise.all([fetch("/api/manifest").then(r => r.json()), fetch("/api/selections").then(r => r.json())]);
  const main = document.getElementById("main");
  main.replaceChildren();
  for (const g of M.groups) {
    const tbody = $("tbody");
    g.symbols.forEach(s => tbody.append(row(s)));
    main.append($("section", {}, $("h2", { textContent: g.title }),
      $("table", {}, $("thead", {}, $("tr", {}, ...["Symbol", "Reference", "Chosen", "Variants", "Final set", "Reiterate"].map(t => $("th", { textContent: t })))), tbody)));
  }
  counts(); applyFilter();
  document.getElementById("saved").textContent = "Up to date";
}
document.querySelectorAll(".filters button").forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll(".filters button").forEach(x => x.classList.toggle("on", x === b));
  applyFilter();
});
load();
</script>
</body>
</html>
